<!DOCTYPE html>
<html lang="en">
<head>

    <title>AM Webtech - Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Radio Buttons -->
    <input type="radio" name="Photos" id="check1" checked>

    <input type="radio" name="Photos" id="check4">

    <div class="container">

        <!-- Filter Menu -->
        <div class="top-content">
            <h3>Photo Gallery</h3>

            <label for="check1">All Photos</label>
            <label for="check2">Flower Photos</label>
            <label for="check3">Rose Photos</label>
            <label for="check4">Lotus Photos</label>
        </div>

        <!-- Photo Gallery -->
        <div class="photo-gallery">

            <!-- Lotus Photos -->
            <div class="pic lotus">
                <img src="lotus5.jpg" alt="Lotus Flower 1">
            </div>

            <div class="pic lotus">
                <img src="lotus2.jpg" alt="Lotus Flower 2">
            </div>

            <div class="pic lotus">
                <img src="lotus3.jpg" alt="Lotus Flower 3">
            </div>

            <div class="pic lotus">
                <img src="lotus4.jpg" alt="Lotus Flower 4">
            </div>

            <!-- Flower Photos -->
            <div class="pic flower">
                <img src="flower1.jpg" alt="Flower 1">
            </div>

            <div class="pic flower">
                <img src="flower2.jpg" alt="Flower 2">
            </div>

            <div class="pic flower">
                <img src="flower3.jpg" alt="Flower 3">
            </div>

            <div class="pic flower">
                <img src="flower4.jpg" alt="Flower 4">
            </div>

            <div class="pic flower">
                <img src="flower5.jpg" alt="Flower 5">
            </div>

            <!-- Rose Photos -->
            <div class="pic rose">
                <img src="rose1.jpg" alt="Red Rose">
            </div>

            <div class="pic rose">
                <img src="rose2.jpg" alt="Pink Rose">
            </div>

            <div class="pic rose">
                <img src="rose3.jpg" alt="White Rose">
            </div>

            <div class="pic rose">
                <img src="rose4.jpg" alt="Yellow Rose">
            </div>

            <div class="pic rose">
                <img src="rose5.jpg" alt="Beautiful Rose">
            </div>

        </div>
    </div>

</body>
</html>
